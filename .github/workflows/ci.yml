name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Чеккаут кода
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Проверка синтаксиса (Flake8)
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # Проверка на критические синтаксические ошибки Python
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Сборка Docker-образа
        run: |
          docker build -t zabbix-camera-bot:latest .